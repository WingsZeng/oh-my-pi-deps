name: Generate Bun dependencies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: oh-my-pi version without the v prefix; latest when omitted
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=${INPUT_VERSION}
          if [[ -z ${version} ]]; then
            version=$(gh api repos/can1357/oh-my-pi/releases/latest --jq .tag_name)
            version=${version#v}
          fi
          [[ ${version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid version: ${version}" >&2
            exit 1
          }
          rebuild=true
          if [[ -z ${INPUT_VERSION} ]] && gh release view "v${version}" >/dev/null 2>&1; then
            rebuild=false
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "rebuild=${rebuild}" >> "${GITHUB_OUTPUT}"

      - name: Check out oh-my-pi
        if: steps.version.outputs.rebuild == 'true'
        uses: actions/checkout@v6
        with:
          repository: can1357/oh-my-pi
          ref: v${{ steps.version.outputs.value }}

      - name: Set up Bun
        if: steps.version.outputs.rebuild == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        if: steps.version.outputs.rebuild == 'true'
        run: bun install --frozen-lockfile --ignore-scripts --backend=copyfile

      - name: Create deterministic archive
        if: steps.version.outputs.rebuild == 'true'
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          stage="oh-my-pi-${VERSION}"
          archive="oh-my-pi-${VERSION}-node-deps.tar.xz"
          mkdir "${stage}"
          mv node_modules "${stage}/"
          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime=@0 \
            --format=gnu \
            -cf - "${stage}" \
            | xz -T2 -9e > "${archive}"
          sha256sum "${archive}"
          echo "path=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Publish release asset
        if: steps.version.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --notes ""
          fi
          gh release upload "${tag}" "${ARCHIVE}" --clobber
